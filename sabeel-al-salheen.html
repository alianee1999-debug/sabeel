<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبيل الصالحين</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#c9a84c; --gold-light:#e8c97a; --gold-dark:#8b6914;
  --emerald:#1a4a3a; --emerald-mid:#2d6b55; --emerald-light:#3d8b6e;
  --cream:#faf6ed; --ink:#1c1208; --shadow-gold:rgba(201,168,76,0.25);
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Scheherazade New',serif; background:var(--emerald); color:var(--cream); min-height:100vh; overflow-x:hidden; }
body::before{ content:''; position:fixed; inset:0; background:radial-gradient(ellipse at 20% 20%,rgba(201,168,76,0.07) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(201,168,76,0.05) 0%,transparent 60%); pointer-events:none; z-index:0; }

/* ── SCREENS ── */
.screen{ display:none; position:relative; z-index:1; min-height:100vh; }
.screen.active{ display:block; }

/* ── HEADER ── */
.app-header{ text-align:center; padding:36px 20px 24px; }
.app-header h1{ font-family:'Amiri',serif; font-size:clamp(1.8rem,5vw,2.6rem); color:var(--gold-light); text-shadow:0 2px 20px rgba(201,168,76,0.4); }
.app-header p{ font-size:.95rem; color:rgba(250,246,237,.55); margin-top:6px; font-style:italic; }
.header-line{ width:160px; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:14px auto 0; }

/* ── DAYS GRID ── */
.days-wrap{ padding:10px 16px 80px; max-width:600px; margin:0 auto; }
.day-card{ background:rgba(255,255,255,.04); border:1px solid rgba(201,168,76,.18); border-radius:16px; margin-bottom:12px; overflow:hidden; cursor:pointer; transition:all .25s; }
.day-card:hover{ border-color:rgba(201,168,76,.4); background:rgba(201,168,76,.06); }
.day-card-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; }
.day-name{ font-family:'Amiri',serif; font-size:1.25rem; color:var(--gold-light); }
.day-meta{ font-size:.85rem; color:rgba(250,246,237,.45); margin-top:2px; }
.day-prog-mini{ display:flex; align-items:center; gap:8px; }
.day-prog-circle{ width:42px; height:42px; position:relative; }
.day-prog-circle svg{ transform:rotate(-90deg); }
.day-prog-circle .prog-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.7rem; color:var(--gold); font-weight:700; }
.day-arrow{ color:rgba(201,168,76,.5); font-size:1.1rem; margin-right:4px; }

/* ── DAY DETAIL ── */
.detail-wrap{ max-width:680px; margin:0 auto; padding:0 14px 80px; }
.back-btn{ display:flex; align-items:center; gap:8px; padding:14px 16px 8px; cursor:pointer; color:rgba(250,246,237,.6); font-size:1rem; transition:color .2s; width:fit-content; }
.back-btn:hover{ color:var(--gold); }

/* Time toggle */
.time-toggle{ display:flex; gap:10px; padding:10px 16px 18px; max-width:680px; margin:0 auto; }
.time-btn{ flex:1; padding:13px; border-radius:50px; border:1.5px solid rgba(201,168,76,.3); background:rgba(255,255,255,.04); color:rgba(250,246,237,.7); font-family:'Scheherazade New',serif; font-size:1.1rem; cursor:pointer; transition:all .3s; display:flex; align-items:center; justify-content:center; gap:8px; }
.time-btn.active{ background:linear-gradient(135deg,var(--gold-dark),var(--gold)); border-color:var(--gold); color:var(--ink); font-weight:700; box-shadow:0 4px 20px var(--shadow-gold); }

/* Progress */
.prog-bar-wrap{ background:rgba(255,255,255,.05); border:1px solid rgba(201,168,76,.18); border-radius:12px; padding:13px 18px; margin:0 14px 18px; display:flex; align-items:center; gap:14px; max-width:652px; margin-left:auto; margin-right:auto; }
.prog-label{ font-size:.9rem; color:var(--gold); white-space:nowrap; }
.prog-outer{ flex:1; height:7px; background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; }
.prog-inner{ height:100%; background:linear-gradient(90deg,var(--gold-dark),var(--gold-light)); border-radius:99px; transition:width .5s ease; }
.prog-nums{ font-size:.85rem; color:rgba(250,246,237,.5); white-space:nowrap; }

/* Section */
.section{ margin-bottom:22px; }
.sec-title{ font-family:'Amiri',serif; font-size:1.15rem; color:var(--gold); display:flex; align-items:center; gap:8px; margin-bottom:10px; padding-bottom:7px; border-bottom:1px solid rgba(201,168,76,.18); }

/* Worship card */
.wcard{ background:rgba(255,255,255,.04); border:1px solid rgba(201,168,76,.13); border-radius:13px; padding:14px 16px; margin-bottom:9px; display:flex; align-items:flex-start; gap:12px; cursor:pointer; transition:all .25s; position:relative; overflow:hidden; }
.wcard::before{ content:''; position:absolute; right:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg,var(--gold-dark),var(--gold)); opacity:0; transition:opacity .25s; border-radius:0 13px 13px 0; }
.wcard:hover{ background:rgba(201,168,76,.07); border-color:rgba(201,168,76,.28); }
.wcard.done{ background:rgba(201,168,76,.08); border-color:rgba(201,168,76,.32); }
.wcard.done::before{ opacity:1; }
.wcheck{ width:25px; height:25px; min-width:25px; border-radius:50%; border:2px solid rgba(201,168,76,.45); display:flex; align-items:center; justify-content:center; margin-top:2px; transition:all .25s; font-size:.75rem; color:transparent; }
.wcard.done .wcheck{ background:linear-gradient(135deg,var(--gold-dark),var(--gold)); border-color:var(--gold); color:var(--ink); }
.wtitle{ font-size:1.05rem; color:var(--cream); line-height:1.6; margin-bottom:3px; }
.wcard.done .wtitle{ color:var(--gold-light); }
.wdetail{ font-size:.88rem; color:rgba(250,246,237,.5); line-height:1.5; }
.wcount{ background:rgba(201,168,76,.14); color:var(--gold); border-radius:20px; padding:2px 10px; font-size:.82rem; display:inline-block; margin-top:5px; }
.wimg{ max-width:100%; max-height:180px; border-radius:9px; margin-top:8px; object-fit:contain; display:block; cursor:zoom-in; border:1px solid rgba(201,168,76,.2); }

/* Empty */
.empty{ text-align:center; padding:40px 20px; color:rgba(250,246,237,.3); font-size:1rem; }
.empty span{ font-size:2.5rem; display:block; margin-bottom:8px; }

/* ── ADMIN ── */
.admin-btn{ position:fixed; bottom:22px; left:22px; width:48px; height:48px; border-radius:50%; background:rgba(28,18,8,.88); border:1.5px solid rgba(201,168,76,.4); color:var(--gold); font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(8px); transition:all .3s; }
.admin-btn:hover{ border-color:var(--gold); box-shadow:0 0 18px var(--shadow-gold); }

.overlay{ position:fixed; inset:0; background:rgba(10,24,18,.92); backdrop-filter:blur(6px); z-index:200; display:none; align-items:center; justify-content:center; padding:16px; }
.overlay.open{ display:flex; }
.panel{ background:linear-gradient(145deg,#0d2a1e,#122b1e); border:1px solid rgba(201,168,76,.28); border-radius:20px; padding:26px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:panelIn .3s ease; }
@keyframes panelIn{ from{opacity:0;transform:scale(.95) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
.panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid rgba(201,168,76,.18); }
.panel-header h2{ font-family:'Amiri',serif; font-size:1.35rem; color:var(--gold); }
.close-x{ background:none; border:none; color:rgba(250,246,237,.5); font-size:1.4rem; cursor:pointer; }

/* pwd gate */
.pwd-gate p{ color:rgba(250,246,237,.7); margin-bottom:12px; text-align:center; }
.pwd-input{ width:100%; padding:12px; background:rgba(255,255,255,.06); border:1.5px solid rgba(201,168,76,.3); border-radius:10px; color:var(--cream); font-size:1rem; font-family:'Scheherazade New',serif; text-align:center; letter-spacing:4px; outline:none; transition:border-color .2s; margin-bottom:10px; }
.pwd-input:focus{ border-color:var(--gold); }
.pwd-err{ color:#e57373; font-size:.88rem; text-align:center; min-height:18px; margin-bottom:6px; }

/* setup gate */
#gate-setup{ display:none; }
#gate-setup p{ color:var(--gold); text-align:center; margin-bottom:12px; }

/* admin tabs */
.admin-tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
.atab{ padding:7px 16px; border-radius:20px; font-family:'Scheherazade New',serif; font-size:.9rem; border:1px solid rgba(201,168,76,.22); background:transparent; color:rgba(250,246,237,.6); cursor:pointer; transition:all .2s; }
.atab.active{ background:rgba(201,168,76,.18); border-color:var(--gold); color:var(--gold); }

/* form */
.fg{ margin-bottom:14px; }
.fg label{ display:block; font-size:.88rem; color:rgba(250,246,237,.65); margin-bottom:5px; }
.fi,.fs,.ft{ width:100%; padding:10px 13px; background:rgba(255,255,255,.06); border:1.5px solid rgba(201,168,76,.22); border-radius:10px; color:var(--cream); font-size:.95rem; font-family:'Scheherazade New',serif; outline:none; transition:border-color .2s; }
.fi:focus,.fs:focus,.ft:focus{ border-color:var(--gold); }
.fs option{ background:#0d2a1e; }
.ft{ min-height:70px; resize:vertical; }
.btn{ padding:10px 20px; border:none; border-radius:10px; font-family:'Scheherazade New',serif; font-size:.95rem; cursor:pointer; transition:all .25s; }
.btn-g{ background:linear-gradient(135deg,var(--gold-dark),var(--gold)); color:var(--ink); font-weight:700; }
.btn-g:hover{ box-shadow:0 4px 16px var(--shadow-gold); transform:translateY(-1px); }
.btn-r{ background:rgba(229,115,115,.12); border:1px solid rgba(229,115,115,.35); color:#ef9a9a; }
.btn-s{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); color:rgba(250,246,237,.8); }

/* manage rows */
.mrow{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:rgba(255,255,255,.04); border:1px solid rgba(201,168,76,.1); border-radius:10px; margin-bottom:7px; }
.mrow-txt{ flex:1; }
.mrow-title{ font-size:.92rem; color:var(--cream); }
.mrow-meta{ font-size:.78rem; color:rgba(250,246,237,.38); margin-top:2px; }

/* confirm modal */
.cmodal{ position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:400; display:none; align-items:center; justify-content:center; padding:20px; }
.cmodal.open{ display:flex; }
.cbox{ background:linear-gradient(145deg,#0d2a1e,#122b1e); border:1px solid rgba(229,115,115,.35); border-radius:16px; padding:26px; width:100%; max-width:320px; text-align:center; }
.cbox .icon{ font-size:2rem; margin-bottom:10px; }
.cbox p{ color:var(--cream); font-size:1rem; margin-bottom:18px; line-height:1.6; }
.cbtns{ display:flex; gap:10px; }

/* edit modal */
.emodal{ position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:400; display:none; align-items:center; justify-content:center; padding:16px; }
.emodal.open{ display:flex; }
.ebox{ background:linear-gradient(145deg,#0d2a1e,#122b1e); border:1px solid rgba(201,168,76,.32); border-radius:18px; padding:24px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; }

/* tooltip */
.tooltip{ position:fixed; bottom:84px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--ink); font-size:.88rem; padding:7px 18px; border-radius:20px; pointer-events:none; opacity:0; transition:opacity .3s; z-index:300; white-space:nowrap; }
.tooltip.show{ opacity:1; }

/* reset btns */
.reset-row{ margin-top:10px; }
.rbtn{ width:100%; padding:10px; border-radius:10px; font-family:'Scheherazade New',serif; font-size:.9rem; cursor:pointer; transition:all .25s; margin-bottom:8px; }

/* daily note */
.daily-note{ text-align:center; font-size:.8rem; color:rgba(250,246,237,.3); padding:10px 0 20px; }

@media(max-width:480px){ .panel{ padding:18px; } .wcard{ padding:12px 13px; } }
</style>
</head>
<body>

<!-- ══════════ SCREEN 1: DAYS ══════════ -->
<div class="screen active" id="screen-days">
  <div class="app-header">
    <h1>سبيل الصالحين</h1>
    <p>مستخرَج من كتاب ضياء الصالحين · مفاتيح الجنان</p>
    <div class="header-line"></div>
  </div>
  <div class="days-wrap" id="days-wrap"></div>
</div>

<!-- ══════════ SCREEN 2: TIME SELECT ══════════ -->
<div class="screen" id="screen-time">
  <div class="app-header" style="padding-bottom:10px">
    <div class="back-btn" onclick="goBack('days')" style="margin:0 auto;justify-content:center">← رجوع</div>
    <h1 id="time-screen-day" style="font-size:1.8rem"></h1>
    <div class="header-line"></div>
  </div>
  <div class="time-toggle" style="margin-top:10px">
    <button class="time-btn" id="btn-day" onclick="openTime('day')">
      <span>☀️</span> أعمال النهار
    </button>
    <button class="time-btn" id="btn-night" onclick="openTime('night')">
      <span>🌙</span> أعمال الليل
    </button>
  </div>
  <!-- mini progress per time -->
  <div style="display:flex;gap:10px;padding:0 14px 14px;max-width:680px;margin:0 auto">
    <div id="mini-day"  style="flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.15);border-radius:12px;padding:12px;text-align:center">
      <div style="color:var(--gold);font-size:.85rem;margin-bottom:4px">النهار</div>
      <div id="mini-day-nums"  style="font-size:1.1rem;color:var(--cream)">0/0</div>
    </div>
    <div id="mini-night" style="flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.15);border-radius:12px;padding:12px;text-align:center">
      <div style="color:var(--gold);font-size:.85rem;margin-bottom:4px">الليل</div>
      <div id="mini-night-nums" style="font-size:1.1rem;color:var(--cream)">0/0</div>
    </div>
  </div>
</div>

<!-- ══════════ SCREEN 3: WORSHIP LIST ══════════ -->
<div class="screen" id="screen-list">
  <div style="max-width:680px;margin:0 auto">
    <div class="back-btn" onclick="goBack('time')" style="padding-top:20px">← رجوع</div>
    <div style="text-align:center;padding:4px 0 14px">
      <h2 id="list-title" style="font-family:'Amiri',serif;font-size:1.5rem;color:var(--gold-light)"></h2>
    </div>
    <div class="prog-bar-wrap">
      <span class="prog-label" id="prog-label">التقدم</span>
      <div class="prog-outer"><div class="prog-inner" id="prog-inner" style="width:0%"></div></div>
      <span class="prog-nums" id="prog-nums">0/0</span>
    </div>
    <div id="worship-list" style="padding:0 14px"></div>
    <p class="daily-note">✦ يُجدَّد التقدم يومياً تلقائياً عند منتصف الليل ✦</p>
  </div>
</div>

<!-- ══════════ ADMIN BUTTON ══════════ -->
<button class="admin-btn" onclick="openAdmin()" title="لوحة التحكم">⚙️</button>

<!-- ══════════ ADMIN OVERLAY ══════════ -->
<div class="overlay" id="admin-overlay">
  <div class="panel">
    <div class="panel-header">
      <h2>⚙️ لوحة التحكم</h2>
      <button class="close-x" onclick="closeAdmin()">✕</button>
    </div>

    <!-- PWD GATE -->
    <div id="pwd-gate">
      <div id="gate-login">
        <p>أدخل الرمز السري</p>
        <input class="pwd-input" type="password" id="pwd-input" placeholder="••••••••" maxlength="8" inputmode="numeric">
        <div class="pwd-err" id="pwd-err"></div>
        <button class="btn btn-g" style="width:100%" onclick="checkPwd()">دخول</button>
      </div>
      <div id="gate-setup">
        <p>✦ اضبط رمزك السري لأول مرة</p>
        <input class="pwd-input" type="password" id="setup1" placeholder="أدخل 8 أرقام" maxlength="8" inputmode="numeric">
        <input class="pwd-input" type="password" id="setup2" placeholder="أعد إدخال الرمز" maxlength="8" inputmode="numeric" style="margin-top:6px">
        <div class="pwd-err" id="setup-err"></div>
        <button class="btn btn-g" style="width:100%;margin-top:4px" onclick="saveSetup()">حفظ الرمز ✦</button>
        <button class="btn btn-s" style="width:100%;margin-top:8px" onclick="showLogin()">رجوع</button>
      </div>
    </div>

    <!-- ADMIN CONTENT -->
    <div id="admin-content" style="display:none">
      <div class="admin-tabs">
        <button class="atab active" onclick="aTab('add',this)">إضافة</button>
        <button class="atab" onclick="aTab('manage',this)">إدارة</button>
        <button class="atab" onclick="aTab('settings',this)">الإعدادات</button>
      </div>

      <!-- ADD -->
      <div id="atab-add">
        <div class="fg"><label>اسم العبادة *</label><input class="fi" id="n-title" placeholder="مثال: صلاة الفجر"></div>
        <div class="fg"><label>التفاصيل / الدليل الشرعي</label><textarea class="ft" id="n-detail" placeholder="الدليل من الكتاب أو السنة..."></textarea></div>
        <div class="fg">
          <label>صورة الدليل الشرعي (اختياري)</label>
          <!-- خيارات الإضافة -->
          <div style="display:flex;gap:8px;margin-bottom:8px">
          <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;background:rgba(201,168,76,0.1);border:1.5px dashed rgba(201,168,76,0.4);border-radius:10px;cursor:pointer;font-size:.88rem;color:var(--gold-light);transition:all .2s;position:relative;overflow:hidden">
              🖼️ من المعرض
              <input type="file" id="n-file-input" accept="image/*" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer">
            </label>
            <div style="flex:1">
              <input class="fi" id="n-img" placeholder="أو الصق رابط..." oninput="prevImg('n')" style="height:100%;font-size:.85rem">
            </div>
          </div>
          <!-- معاينة الصورة -->
          <div id="n-img-prev" style="display:none;margin-top:7px;background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.18);border-radius:10px;padding:10px;text-align:center">
            <img id="n-img-thumb" src="" style="max-width:100%;max-height:150px;border-radius:8px;object-fit:contain">
            <div style="display:flex;gap:8px;margin-top:8px">
              <button class="btn" id="n-extract-btn" style="flex:1;padding:7px;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.35);color:var(--gold);font-size:.82rem" onclick="extractText('n')">🤖 استخراج النص بالذكاء الاصطناعي</button>
              <button class="btn btn-r" style="padding:7px 12px;font-size:.82rem" onclick="clearImgFull('n')">✕</button>
            </div>
            <div id="n-extract-status" style="font-size:.8rem;color:rgba(250,246,237,.5);margin-top:5px;min-height:16px"></div>
          </div>
        </div>
        <div class="fg"><label>العدد / التكرار</label><input class="fi" id="n-count" placeholder="مثال: ١٠٠ مرة"></div>
        <div class="fg">
          <label>الوقت</label>
          <select class="fs" id="n-time">
            <option value="day">النهار ☀️</option>
            <option value="night">الليل 🌙</option>
          </select>
        </div>
        <div class="fg">
          <label>اليوم</label>
          <select class="fs" id="n-day">
            <option value="all">كل الأيام</option>
            <option value="0">الأحد</option>
            <option value="1">الاثنين</option>
            <option value="2">الثلاثاء</option>
            <option value="3">الأربعاء</option>
            <option value="4">الخميس</option>
            <option value="5">الجمعة</option>
            <option value="6">السبت</option>
          </select>
        </div>
        <div class="fg"><label>القسم</label><input class="fi" id="n-section" placeholder="مثال: أذكار الصباح"></div>
        <button class="btn btn-g" style="width:100%" onclick="addItem()">إضافة العبادة ✦</button>
      </div>

      <!-- MANAGE -->
      <div id="atab-manage" style="display:none">
        <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
          <button class="atab active" onclick="mFilter('all',this)" style="font-size:.8rem">الكل</button>
          <button class="atab" onclick="mFilter('day',this)"  style="font-size:.8rem">النهار</button>
          <button class="atab" onclick="mFilter('night',this)" style="font-size:.8rem">الليل</button>
        </div>
        <div id="manage-list"></div>
      </div>

      <!-- SETTINGS -->
      <div id="atab-settings" style="display:none">
        <div class="fg">
          <label>تغيير الرمز السري (8 أرقام بالضبط)</label>
          <input class="fi" id="new-pwd" type="password" placeholder="أدخل 8 أرقام" maxlength="8" inputmode="numeric">
          <div style="font-size:.78rem;color:rgba(201,168,76,.55);margin-top:4px">🔒 الرمز لن يُعرض لأحد</div>
        </div>
        <button class="btn btn-g" onclick="changePwd()">حفظ الرمز</button>

// ══════════ STORAGE ══════════
const SK='sbeel_data_v1', PK='sbeel_prog_v1', DK='sbeel_date_v1', PWK='sbeel_pwd_v1';

function gs(k){ try{return localStorage.getItem(k)||sessionStorage.getItem(k)||null}catch(e){try{return sessionStorage.getItem(k)}catch(e2){return null}} }
function ss(k,v){ try{localStorage.setItem(k,v)}catch(e){} try{sessionStorage.setItem(k,v)}catch(e){} }

let items=[], progress={}, currentDay=new Date().getDay(), currentTime='day', mFilterVal='all';

function loadData(){
  try{ const r=gs(SK); items=r?JSON.parse(r):JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  catch(e){ items=JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  const today=new Date().toDateString(), saved=gs(DK);
  if(saved!==today){ progress={}; ss(DK,today); ss(PK,'{}'); }
  else{ try{progress=JSON.parse(gs(PK)||'{}')}catch(e){progress={};} }
}
function saveData(){ ss(SK,JSON.stringify(items)); }
function saveProgress(){ ss(PK,JSON.stringify(progress)); }
function getPwd(){ return gs(PWK)||null; }
function savePwd(v){ ss(PWK,v); }

// ══════════ HELPERS ══════════
function itemsForDayTime(d,t){
  return items.filter(i=>(i.day==='all'||String(i.day)===String(d))&&i.time===t);
}
function progForDayTime(d,t){
  const list=itemsForDayTime(d,t);
  const done=list.filter(i=>progress[String(i.id)]).length;
  return {done, total:list.length};
}

// ══════════ SCREEN NAV ══════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}

function goBack(to){
  if(to==='days') showScreen('days'), renderDays();
  if(to==='time') showScreen('time'), renderTimeScreen();
}

// ══════════ SCREEN 1: DAYS ══════════
function renderDays(){
  const wrap=document.getElementById('days-wrap');
  const today=new Date().getDay();
  wrap.innerHTML='';
  DAYS.forEach((name,d)=>{
    const dayItems=items.filter(i=>i.day==='all'||String(i.day)===String(d));
    const pd=progForDayTime(d,'day'), pn=progForDayTime(d,'night');
    const totalAll=pd.total+pn.total, doneAll=pd.done+pn.done;
    const pct=totalAll?Math.round(doneAll/totalAll*100):0;

    const card=document.createElement('div');
    card.className='day-card';
    if(d===today) card.style.borderColor='rgba(201,168,76,0.45)';

    const circumference=2*Math.PI*16;
    const dash=circumference*(pct/100);

    card.innerHTML=`
      <div class="day-card-header">
        <div>
          <div class="day-name">${DAY_ICONS[d]} ${name}${d===today?' <span style="font-size:.75rem;color:var(--gold);background:rgba(201,168,76,.15);padding:1px 8px;border-radius:10px">اليوم</span>':''}</div>
          <div class="day-meta">${totalAll} عبادة · أُنجز ${doneAll}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="day-prog-circle">
            <svg width="42" height="42" viewBox="0 0 42 42">
              <circle cx="21" cy="21" r="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
              <circle cx="21" cy="21" r="16" fill="none" stroke="${pct===100?'#4caf50':'#c9a84c'}" stroke-width="3"
                stroke-dasharray="${dash} ${circumference}" stroke-linecap="round"/>
            </svg>
            <div class="prog-text">${pct}%</div>
          </div>
          <div class="day-arrow">‹</div>
        </div>
      </div>`;
    card.addEventListener('click',()=>{ currentDay=d; openDayDetail(d); });
    wrap.appendChild(card);
  });
}

function openDayDetail(d){
  currentDay=d;
  document.getElementById('time-screen-day').textContent=DAY_ICONS[d]+' '+DAYS[d];
  renderTimeScreen();
  showScreen('time');
}

// ══════════ SCREEN 2: TIME ══════════
function renderTimeScreen(){
  const pd=progForDayTime(currentDay,'day');
  const pn=progForDayTime(currentDay,'night');
  document.getElementById('mini-day-nums').textContent=`${pd.done}/${pd.total}`;
  document.getElementById('mini-night-nums').textContent=`${pn.done}/${pn.total}`;
  // colors
  document.getElementById('mini-day').style.borderColor=pd.done===pd.total&&pd.total>0?'rgba(76,175,80,.4)':'rgba(201,168,76,.15)';

}

function openTime(t){

// ══════════ SCREEN 3: WORSHIP LIST ══════════
function renderWorshipList(){
  const d=currentDay, t=currentTime;
  const dayName=DAYS[d], timeLabel=t==='day'?'☀️ أعمال النهار':'🌙 أعمال الليل';
  document.getElementById('list-title').textContent=`${DAY_ICONS[d]} ${dayName} — ${timeLabel}`;

  const list=document.getElementById('worship-list');
  const tabItems=itemsForDayTime(d,t);

  if(!tabItems.length){
    list.innerHTML='<div class="empty"><span>📿</span>لا توجد عبادات لهذا الوقت</div>';
    updateProg(tabItems); return;
  }

  // group by section
  const secs={};
  tabItems.forEach(i=>{ const s=i.section||'عام'; if(!secs[s])secs[s]=[]; secs[s].push(i); });

  list.innerHTML=Object.entries(secs).map(([sec,its])=>`
    <div class="section">
      <div class="sec-title"><span>${SEC_ICONS[sec]||'✦'}</span>${sec}</div>
      ${its.map(item=>`
        <div class="wcard ${progress[String(item.id)]?'done':''}" onclick="toggle(${item.id})">
          <div class="wcheck">${progress[String(item.id)]?'✓':''}</div>
          <div style="flex:1">
            <div class="wtitle">${item.title}</div>
            ${item.detail?`<div class="wdetail">${item.detail}</div>`:''}
            ${item.image?`
              <div style="position:relative;display:inline-block;width:100%;margin-top:8px" onclick="event.stopPropagation()">
                <img class="wimg" src="${item.image}" onclick="zoomImg('${item.image}')" loading="lazy" style="margin-top:0">
                <button onclick="event.stopPropagation();downloadImg('${item.image}','${item.title.replace(/'/g,'')}')"
                  style="margin-top:5px;width:100%;padding:6px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.28);border-radius:8px;color:var(--gold);font-family:'Scheherazade New',serif;font-size:.82rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px">
                  ⬇️ تنزيل الصورة
                </button>
              </div>`:''}
            ${item.count?`<span class="wcount">🔢 ${item.count}</span>`:''}
          </div>
        </div>`).join('')}
    </div>`).join('');

  updateProg(tabItems);
}

function toggle(id){
  const k=String(id);
  progress[k]=!progress[k];
  saveProgress();
  renderWorshipList();
  renderTimeScreen();
  if(progress[k]) showTip('✦ أحسنت! تم التحقق ✦');
}

function updateProg(tabItems){
  const done=tabItems.filter(i=>progress[String(i.id)]).length;
  const total=tabItems.length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('prog-inner').style.width=pct+'%';
  document.getElementById('prog-nums').textContent=`${done}/${total}`;
  document.getElementById('prog-label').textContent=pct===100?'🎉 اكتمل!':'التقدم';
}

function zoomImg(src){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px';
  o.innerHTML=`
    <img src="${src}" style="max-width:100%;max-height:75vh;border-radius:12px;object-fit:contain">
    <div style="display:flex;gap:10px">
      <button id="zoom-dl" style="padding:9px 22px;background:rgba(201,168,76,0.18);border:1px solid rgba(201,168,76,0.45);border-radius:10px;color:var(--gold);font-family:'Scheherazade New',serif;font-size:.95rem;cursor:pointer">⬇️ تنزيل</button>
      <button id="zoom-cl" style="padding:9px 22px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:rgba(250,246,237,0.8);font-family:'Scheherazade New',serif;font-size:.95rem;cursor:pointer">✕ إغلاق</button>
    </div>`;
  o.querySelector('#zoom-dl').addEventListener('click',function(e){e.stopPropagation();downloadImg(src,'صورة-الدليل');});
  o.querySelector('#zoom-cl').addEventListener('click',function(){document.body.removeChild(o);});
  o.addEventListener('click',function(e){if(e.target===o)document.body.removeChild(o);});
  document.body.appendChild(o);
}

function downloadImg(src, name){
  // محاولة التنزيل المباشر
  const a=document.createElement('a');
  a.href=src;
  a.download=(name||'صورة-الدليل')+'.jpg';
  a.target='_blank';
  // إذا كان رابط خارجي افتح في تبويب جديد
  if(src.startsWith('http')){
    // نحاول fetch للصور الخارجية
    fetch(src)
      .then(r=>r.blob())
      .then(blob=>{
        const url=URL.createObjectURL(blob);
        const dl=document.createElement('a');
        dl.href=url; dl.download=(name||'صورة')+'.jpg';
        dl.click();
        setTimeout(()=>URL.revokeObjectURL(url),2000);
        showTip('✦ جاري التنزيل ✦');
      })
      .catch(()=>{
        // إذا فشل fetch افتح الصورة في تبويب جديد
        window.open(src,'_blank');
        showTip('✦ تم فتح الصورة — اضغط مطولاً للحفظ ✦');
      });
  } else {
    a.click();
    showTip('✦ جاري التنزيل ✦');
  }
}

// ══════════ IMAGE HELPERS ══════════
// تخزين base64 للصور المرفوعة
const imgStore = {}; // prefix -> base64

function initFileInputs(){
  ['n','e'].forEach(function(p){
    const inp = document.getElementById(p+'-file-input');
    if(!inp) return;
    inp.addEventListener('change', function(){
      const file = this.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(ev){
        const b64 = ev.target.result;
        imgStore[p] = b64;
        document.getElementById(p+'-img').value = '';
        showImgPreview(p, b64);
      };
      reader.readAsDataURL(file);
    });
  });
}

function showImgPreview(p, src){
  const thumb = document.getElementById(p+'-img-thumb');
  const prev  = document.getElementById(p+'-img-prev');
  thumb.src = src;
  prev.style.display = 'block';
  document.getElementById(p+'-extract-status').textContent = '';
}

function prevImg(p){
  const url = document.getElementById(p+'-img').value.trim();
  const prev = document.getElementById(p+'-img-prev');
  if(url){
    imgStore[p] = null; // رابط خارجي، لا base64
    const thumb = document.getElementById(p+'-img-thumb');
    thumb.src = url;
    thumb.onload  = function(){ prev.style.display='block'; };
    thumb.onerror = function(){ prev.style.display='none'; };
  } else {
    prev.style.display='none';
  }
}

function clearImgFull(p){
  imgStore[p] = null;
  document.getElementById(p+'-img').value = '';
  document.getElementById(p+'-img-thumb').src = '';
  document.getElementById(p+'-img-prev').style.display = 'none';
  document.getElementById(p+'-extract-status').textContent = '';
  const inp = document.getElementById(p+'-file-input');
  if(inp) inp.value = '';
}

function getImgSrc(p){
  // إذا عندنا base64 نرجعه، وإلا نرجع الرابط
  return imgStore[p] || document.getElementById(p+'-img').value.trim() || '';
}

// ══════════ AI TEXT EXTRACTION ══════════
async function extractText(p){
  const src = getImgSrc(p);
  if(!src){ showTip('أضف صورة أولاً'); return; }

  const btn    = document.getElementById(p+'-extract-btn');
  const status = document.getElementById(p+'-extract-status');
  const detail = document.getElementById(p === 'n' ? 'n-detail' : 'e-detail');

  btn.textContent = '⏳ جاري الاستخراج...';
  btn.disabled = true;
  status.textContent = 'يُحلِّل الذكاء الاصطناعي الصورة...';
  status.style.color = 'rgba(201,168,76,0.7)';

  try {
    let imageContent;

    if(src.startsWith('data:image')){
      // base64 مباشر
      const mediaType = src.split(';')[0].split(':')[1];
      const b64data   = src.split(',')[1];
      imageContent = { type:'image', source:{ type:'base64', media_type: mediaType, data: b64data } };
    } else {
      // رابط خارجي — نحاول fetch أولاً
      try {
        const res  = await fetch(src);
        const blob = await res.blob();
        const b64  = await new Promise(function(resolve){
          const r = new FileReader();
          r.onload = function(){ resolve(r.result); };
          r.readAsDataURL(blob);
        });
        const mediaType = b64.split(';')[0].split(':')[1];
        const b64data   = b64.split(',')[1];
        imageContent = { type:'image', source:{ type:'base64', media_type: mediaType, data: b64data } };
      } catch(e){
        // إذا فشل fetch نستخدم URL مباشرة
        imageContent = { type:'image', source:{ type:'url', url: src } };
      }
    }

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            imageContent,
            {
              type: 'text',
              text: 'هذه صورة لدليل شرعي أو نص ديني. استخرج النص العربي الموجود فيها بدقة تامة. أعطني النص فقط بدون أي شرح أو مقدمة أو تنسيق إضافي.'
            }
          ]
        }]
      })
    });

    const data = await response.json();

    if(data.content && data.content[0] && data.content[0].text){
      const extracted = data.content[0].text.trim();
      // أضف النص المستخرج إلى حقل التفاصيل
      const current = detail.value.trim();
      detail.value = current ? current + '\n\n' + extracted : extracted;
      status.textContent = '✓ تم استخراج النص بنجاح';
      status.style.color = 'rgba(76,175,80,0.9)';
      showTip('✦ تم استخراج النص وإضافته للدليل ✦');
    } else {
      throw new Error('لا يوجد نص');
    }

  } catch(err){
    status.textContent = '⚠️ تعذّر الاستخراج — أضف النص يدوياً';
    status.style.color = 'rgba(239,154,154,0.9)';
  } finally {
    btn.textContent = '🤖 استخراج النص بالذكاء الاصطناعي';
    btn.disabled = false;
  }
}


function addItem(){
  const title=document.getElementById('n-title').value.trim();
  if(!title){alert('أدخل اسم العبادة');return;}
  items.push({
    id:Date.now(),
    title,
    detail:document.getElementById('n-detail').value.trim(),
    image:getImgSrc('n'),
    count:document.getElementById('n-count').value.trim(),
    time:document.getElementById('n-time').value,
    day:document.getElementById('n-day').value,
    section:document.getElementById('n-section').value.trim()||'عام',
  });
  saveData(); renderDays();
  ['n-title','n-detail','n-img','n-count','n-section'].forEach(i=>document.getElementById(i).value='');
  clearImgFull('n');
  showTip('✦ تمت الإضافة بنجاح ✦');
}

// MANAGE
let mFilterVal2='all';
function mFilter(f,el){
  mFilterVal2=f;
  document.querySelectorAll('#atab-manage .atab').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  renderManage();
}
function renderManage(){
  const filtered=mFilterVal2==='all'?items:items.filter(i=>i.time===mFilterVal2);
  const wrap=document.getElementById('manage-list');
  while(wrap.firstChild) wrap.removeChild(wrap.firstChild);
  if(!filtered.length){
    const p=document.createElement('p');
    p.style.cssText='color:rgba(250,246,237,.38);text-align:center;padding:20px';
    p.textContent='لا توجد عبادات'; wrap.appendChild(p); return;
  }
  filtered.forEach(item=>{
    const row=document.createElement('div'); row.className='mrow';
    const txt=document.createElement('div'); txt.className='mrow-txt';
    const t=document.createElement('div'); t.className='mrow-title'; t.textContent=item.title;
    const m=document.createElement('div'); m.className='mrow-meta';
    const dayLabel=item.day==='all'?'كل الأيام':DAYS[parseInt(item.day)]||'';
    m.textContent=(item.time==='day'?'☀️':'🌙')+' · '+dayLabel+' · '+(item.section||'عام');
    txt.appendChild(t); txt.appendChild(m);
    const acts=document.createElement('div'); acts.style.cssText='display:flex;gap:6px';

    const eBtn=document.createElement('button'); eBtn.className='btn'; eBtn.textContent='تعديل';
    eBtn.style.cssText='padding:5px 9px;font-size:.78rem;background:rgba(201,168,76,.13);border:1px solid rgba(201,168,76,.32);color:var(--gold)';
    eBtn.type='button';
    eBtn.addEventListener('click',function(e){e.stopPropagation();openEdit(item.id);});

    const dBtn=document.createElement('button'); dBtn.className='btn btn-r'; dBtn.textContent='حذف';
    dBtn.style.cssText='padding:5px 9px;font-size:.78rem';
    dBtn.type='button';
    dBtn.addEventListener('click',function(e){
      e.stopPropagation();
      customConfirm('هل تريد حذف هذه العبادة؟',function(){
        items=items.filter(function(i){return String(i.id)!==String(item.id);});
        delete progress[String(item.id)];
        saveData(); saveProgress(); renderDays(); renderManage();
        showTip('✦ تم الحذف ✦');
      });
    });

    acts.appendChild(eBtn); acts.appendChild(dBtn);
    row.appendChild(txt); row.appendChild(acts);
    wrap.appendChild(row);
  });
}

// EDIT
function openEdit(id){
  const item=items.find(i=>String(i.id)===String(id));
  if(!item) return;
  document.getElementById('e-id').value=id;
  document.getElementById('e-title').value=item.title||'';
  document.getElementById('e-detail').value=item.detail||'';
  document.getElementById('e-count').value=item.count||'';
  document.getElementById('e-time').value=item.time||'day';
  document.getElementById('e-day').value=item.day||'all';
  document.getElementById('e-section').value=item.section||'';
  imgStore['e']=null;
  if(item.image&&item.image.startsWith('data:')){
    imgStore['e']=item.image;
    document.getElementById('e-img').value='';
    showImgPreview('e',item.image);
  } else if(item.image){
    document.getElementById('e-img').value=item.image;
    showImgPreview('e',item.image);
  } else {
    document.getElementById('e-img').value='';
    document.getElementById('e-img-prev').style.display='none';
  }
  document.getElementById('e-extract-status').textContent='';
  document.getElementById('emodal').classList.add('open');
}
function closeEdit(){ document.getElementById('emodal').classList.remove('open'); }
function saveEdit(){
  const id=document.getElementById('e-id').value;
  const title=document.getElementById('e-title').value.trim();
  if(!title){alert('أدخل اسم العبادة');return;}
  const idx=items.findIndex(i=>String(i.id)===String(id));
  if(idx===-1) return;
  items[idx]={...items[idx],title,
    detail:document.getElementById('e-detail').value.trim(),
    image:getImgSrc('e'),
    count:document.getElementById('e-count').value.trim(),
    time:document.getElementById('e-time').value,
    day:document.getElementById('e-day').value,
    section:document.getElementById('e-section').value.trim()||'عام',
  };
  saveData(); renderDays(); renderManage(); closeEdit();
  showTip('✦ تم حفظ التعديل ✦');
}

// CONFIRM
function customConfirm(msg,onYes){
  const modal=document.getElementById('cmodal');
  document.getElementById('cmsg').textContent=msg;
  modal.classList.add('open');
  const y=document.getElementById('cyes').cloneNode(true);
  const n=document.getElementById('cno').cloneNode(true);
  document.getElementById('cyes').replaceWith(y);
  document.getElementById('cno').replaceWith(n);
  y.addEventListener('click',function(){modal.classList.remove('open');onYes();});
  n.addEventListener('click',function(){modal.classList.remove('open');});
}

// TOOLTIP
let tipTimer;
function showTip(msg){
  const el=document.getElementById('tooltip');
  if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>el.classList.remove('show'),2400);
}
